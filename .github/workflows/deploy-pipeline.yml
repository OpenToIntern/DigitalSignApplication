name: Deployment
on:
  push:
    branches: [main, develop]

jobs:
  validate:
    name: Typecheck & Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Typecheck Frontend
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
      - name: Typecheck Backend
        run: |
          cd backend
          npm ci
          npx tsc --noEmit

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Set deploy path
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "path=/var/www/signhere-production/app" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "path=/var/www/signhere-sandbox/app" >> "$GITHUB_OUTPUT"
            echo "env=sandbox" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "Connected as: $(whoami)"
            echo "Target path: ${{ steps.config.outputs.path }}"
            cd ${{ steps.config.outputs.path }} || { echo "cd FAILED"; exit 1; }
            echo "Current dir: $(pwd)"
            ls -la deploy.sh
            bash deploy.sh ${{ github.ref_name }} ${{ steps.config.outputs.env }}

      - name: Summary
        run: echo "Deployed **${{ steps.config.outputs.env }}**"